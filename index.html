<script src="https://cdn.jsdelivr.net/npm/docx@9.16.1/dist/index.iife.js"></script>
<style>
:root{--g:#1b8a3a;--g2:#e8f5ec;--tx:#1d2a22;--mu:#6b7a70;--bd:#dfe6e1;--bg:#f5f7f5;--red:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
header{background:var(--g);color:#fff;padding:14px 16px 12px}
header .brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px}
header .logo{height:38px;width:auto;flex:none}
header .sub{font-size:13px;opacity:.9;margin-top:2px}
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
h2{margin:6px 0 10px;font-size:20px}
.hint{color:var(--mu);font-size:13px;margin:0 0 12px}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#fff;color:var(--tx)}
textarea{min-height:80px;resize:vertical}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:#fff;color:var(--g);border:1px solid var(--g)}
.btn.red{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn.sm{padding:7px 12px;font-size:13px}
.link{background:none;border:0;color:var(--g);font:inherit;font-weight:600;cursor:pointer;padding:6px 0}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.prog{height:6px;background:var(--bd);border-radius:6px;overflow:hidden}
.prog div{height:100%;background:var(--g)}
.stepn{font-size:12px;color:var(--mu);margin-top:8px}
.err{color:var(--red);font-weight:600;font-size:14px;min-height:0}
.wnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--c,#555);color:#fff;border-radius:20px;padding:3px 10px;font-size:13px;font-weight:600}
.chip button{background:none;border:0;color:#fff;font-size:16px;cursor:pointer;padding:0}
.box{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.tab{flex:1;border:1px solid var(--bd);background:#fff;border-radius:10px;padding:9px 6px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--g);color:#fff;border-color:var(--g)}
.tab small{opacity:.75;font-weight:500}
.slotrow{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:6px;display:grid;grid-template-columns:96px 1fr;gap:6px;align-items:center}
.slotrow.busy{border-color:var(--g);background:var(--g2)}
.slotrow input{grid-column:2}
.st b{display:block;font-size:13px}.st small{color:var(--mu);font-size:12px}
.srow{display:grid;grid-template-columns:1fr 86px 86px 34px;gap:6px;margin-bottom:6px}
.x{background:#fff;border:1px solid var(--bd);border-radius:8px;color:var(--red);font-size:18px;cursor:pointer}
.fer{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--bd);font-size:14px}
.fer input[type=checkbox]{width:20px;height:20px;flex:none}
.fer .d{font-weight:700;width:78px;flex:none}
.fer .n{flex:1}
.fer.wk{opacity:.5}
.tag{font-size:11px;background:#eee;border-radius:6px;padding:2px 6px;color:#555}
nav.tb{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;z-index:5}
nav.tb button{flex:1;background:none;border:0;padding:9px 2px 11px;font:inherit;font-size:12px;color:var(--mu);cursor:pointer}
nav.tb button b{display:block;font-size:19px;line-height:1.2}
nav.tb button.on{color:var(--g);font-weight:700}
.filt{display:flex;gap:8px;margin-bottom:10px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:6px}
.nav button{background:var(--g2);border:0;border-radius:8px;width:42px;height:38px;font-size:22px;color:var(--g);cursor:pointer}
.day{margin-top:14px}
.dh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;margin-bottom:6px}
.day.today .dh span:first-child{color:var(--g)}
.day.today .dh span:first-child::after{content:" • hoje";font-size:12px}
.badge{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;text-transform:none}
.badge.fer{background:#fde2e0;color:var(--red)}
.badge.ext{background:#e3effd;color:#1f5fa8}
.off{background:#fff;border:1px dashed var(--bd);border-radius:10px;padding:10px;color:var(--mu);font-size:14px}
.card{background:#fff;border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:10px;padding:9px 10px;margin-bottom:6px;cursor:pointer}
.card.done{opacity:.7}
.card.cancel{opacity:.6;background:#f3f3f3}
.card.cancel .as{text-decoration:line-through}
.pend{background:#fff4e5;border:1px solid #f6c343;border-radius:12px;padding:8px 10px;margin-bottom:10px;font-size:14px}
.pend button{background:none;border:0;color:#8a5a00;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:2px 0;text-align:left}
.ct{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hr{font-weight:700;font-size:13px}
.comp{font-size:13px;font-weight:600}
.num{font-size:11px;color:var(--mu);margin-left:auto}
.ok{color:var(--g);font-weight:800}
.as{margin-top:5px;font-size:14px}
.cm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px}
.wkg{display:none}
.cfg{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.cfg h3{font-size:16px;margin:0}.cfg .hint{margin:0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt.on{border-color:var(--g);background:#eef7f0}.opt input{width:auto;margin-top:3px}
.opt span{display:flex;flex-direction:column}
.passos{margin:6px 0 12px;padding-left:20px;line-height:1.5;font-size:15px}.passos li{margin-bottom:6px}.opt small{color:var(--mu);font-size:13px}
.as.vazio{color:var(--g);font-weight:600;font-size:13px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.mh{text-align:center;font-size:12px;font-weight:700;color:var(--mu)}
.mc{background:#fff;border:1px solid var(--bd);border-radius:8px;min-height:50px;padding:4px;font-size:13px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}
.mc.out{opacity:.35}
.mc.today{border-color:var(--g);border-width:2px}
.mc.sel{background:var(--g2)}
.mc.hol{background:#fdecea}
.mc i{font-style:normal;font-size:11px;font-weight:700;border-radius:10px;padding:1px 6px;align-self:flex-end}
.mc i.full{background:var(--g);color:#fff}
.mc i.pend{background:#f6c343;color:#3d3000}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:8px}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--lc)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:center}
th:first-child,td:first-child{text-align:left}
th{background:var(--g2);font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal.hidden{display:none}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow:auto}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;margin:10px 0}
.ck input{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;z-index:20}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pv{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:12px;font-family:Arial,sans-serif;color:#000}
.pv h1{text-align:center;font-family:'Arial Black',Arial,sans-serif;font-size:22px;margin:4px 0 12px}
.pv .pr{display:grid;gap:6px;margin-bottom:6px}
.pv .b{border:1.5px solid #000;padding:6px 8px;font-size:13px;cursor:pointer;min-height:34px;white-space:pre-wrap;word-break:break-word}
.pv .b:hover{background:#f3faf5}
.pv .b b{display:block}
.pv .b.i b{display:inline}
.pv .b.vz{color:#b07d00}
input,select,textarea{font-size:16px}
nav.tb{padding-bottom:env(safe-area-inset-bottom)}
.mc .mt{display:none}
.wk,.mesw{display:block}
@media(min-width:700px){main{padding-bottom:100px}}
@media(min-width:900px){
  body{font-size:15px}
  header{padding:16px 28px 14px;position:relative;z-index:6}
  header .brand{font-size:20px}
  header .logo{height:44px}
  nav.tb{top:0;bottom:0;right:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:92px 10px 10px;gap:4px;background:#fff}
  nav.tb button{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;font-size:15px;text-align:left}
  nav.tb button b{display:inline;font-size:19px}
  nav.tb button:hover{background:var(--g2)}
  nav.tb button.on{background:var(--g2)}
  body.temnav main{margin-left:200px}
  main{max-width:1180px;padding:22px 28px 40px}
  body:not(.temnav) main{max-width:760px}
  .filt select{max-width:280px}
  .wk{display:none}
  .wkg{display:grid;gap:8px;margin-top:12px;align-items:stretch}
  .wkg .gh{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;background:#fbfcfb;border:1px solid var(--bd);border-radius:10px;grid-row:1}
  .wkg .gh b{font-size:15px}.wkg .gh small{color:var(--mu);font-size:12px}
  .wkg .gh.today{border-color:var(--g);background:#eef7f0}.wkg .gh.today b{color:var(--g)}
  .wkg .gt{grid-column:1;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding-right:4px;border-right:2px solid var(--bd)}
  .wkg .gt b{font-size:14px}.wkg .gt small{font-size:11px;color:var(--mu)}
  .wkg .gc{display:flex}.wkg .gc .card{flex:1;margin:0;display:flex;flex-direction:column}
  .wkg .gc .card .as{margin-top:auto;padding-top:6px}
  .wkg .gv{flex:1;border:1px dashed var(--bd);border-radius:10px;min-height:96px;background:repeating-linear-gradient(135deg,transparent 0 8px,#f6f7f6 8px 9px)}
  .wkg .goff{display:flex;align-items:center;justify-content:center;text-align:center;background:#fdecea;color:#c0392b;border-radius:10px;font-size:14px;padding:10px}
  .wk .day{margin-top:12px;background:#fbfcfb;border:1px solid var(--bd);border-radius:12px;padding:10px}
  .mesw{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:20px;align-items:start}
  .mside .day{margin-top:10px}
  .mc{min-height:92px;padding:6px}
  .mc .mt{display:flex;flex-direction:column;gap:2px;margin-top:3px}
  .mc .mt span{font-size:10px;font-weight:600;color:#fff;background:var(--c);border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card{transition:box-shadow .15s}
  .card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .btn:hover{filter:brightness(1.05)}
  .modal{align-items:center}
  .sheet{border-radius:16px;max-width:680px;max-height:86vh;padding:22px}
  .resbtn{display:grid!important;grid-template-columns:1fr 1fr;gap:10px}
  .resbtn h3,.resbtn p{grid-column:1/-1}
  table{font-size:15px}
}
</style>

<script>

const KEY='organizador-aulas-v1', UIKEY='organizador-aulas-ui';
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

const app=document.getElementById('app');
const pad=n=>String(n).padStart(2,'0');
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmt=s=>{const d=pd(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const fmtA=s=>fmt(s)+'/'+s.slice(0,4);
const fmtLong=s=>{const d=pd(s);return DIAS[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()].toLowerCase()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TODAY=iso(new Date());

function defaultSlots(){return[['s1','1º horário','07:20','08:05'],['s2','2º horário','08:05','08:50'],['s3','3º horário','08:50','09:35'],['s4','4º horário','09:55','10:40'],['s5','5º horário','10:40','11:30'],['s6','6º horário','13:00','13:45'],['s7','7º horário','13:45','14:30'],['s8','8º horário','14:30','15:15']].map(([id,label,ini,fim])=>({id,label,ini,fim}))}
function novo(){const y=new Date().getMonth()>=10?new Date().getFullYear()+1:new Date().getFullYear();return{prof:{nome:'',escola:'',disc:'Ciências',discs:['Ciências']},ano:{ini:y+'-02-01',fim:y+'-12-17'},turmas:[],slots:defaultSlots(),grade:{1:{},2:{},3:{},4:{},5:{}},feriados:[],recessos:[],extras:[],aulas:{},setupDone:false}}

function carregar(){
  try{const t=document.getElementById('dados').textContent;const o=JSON.parse(t);if(o&&o.prof)return o}catch(e){}
  try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&o.prof)return o}catch(e){}
  return novo();
}
let S=carregar();
const DISCS=['Ciências','Matemática','Língua Portuguesa','História','Geografia','Inglês','Arte','Educação Física','Ensino Religioso','Projeto de Vida','Protagonismo','Educação Ambiental','Eletiva','P.E. Ciências','P. Exper. Ciências','P. Exper. Matemática','Estudo Orientado'];
function migrar(){if(!Array.isArray(S.prof.discs)){const l=[];if(S.prof.disc)l.push(S.prof.disc);for(const d in S.grade)for(const k in S.grade[d]){const c=S.grade[d][k].comp;if(c&&!l.includes(c))l.push(c)}S.prof.discs=l}S.prof.disc=S.prof.discs[0]||''}

function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function agendarPub(){clearTimeout(pubTimer);pubTimer=setTimeout(publicar,1200)}
async function publicar(){
  if(!ART)return;
  saveUI();
  const json=JSON.stringify(S).replace(/</g,'\\u003c');
  const a='<script id="dados" type="application/json">';const i=SRC.indexOf(a);const j=SRC.indexOf('<\/script>',i);
  if(i<0||j<0)return;
  const html=SRC.slice(0,i+a.length)+json+SRC.slice(j);
  try{await ART.publish(html)}catch(e){toast('Salvo só neste aparelho')}

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

/* ---------- UI state ---------- */

function mondayOf(s){const x=pd(s);const w=x.getDay();return addD(x,w===0?-6:1-w)}
function resetNav(){const h=clampHoje();weekStart=mondayOf(h);const d=pd(h);monthCur=new Date(d.getFullYear(),d.getMonth(),1);selDay=h}

/* ---------- feriados ---------- */
function pascoa(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function nacionais(y){const p=pascoa(y);return[[y+'-01-01','Confraternização Universal'],[iso(addD(p,-48)),'Carnaval (segunda)'],[iso(addD(p,-47)),'Carnaval (terça)'],[iso(addD(p,-46)),'Quarta-feira de Cinzas'],[iso(addD(p,-2)),'Paixão de Cristo'],[y+'-04-21','Tiradentes'],[y+'-05-01','Dia do Trabalho'],[iso(addD(p,60)),'Corpus Christi'],[y+'-09-07','Independência do Brasil'],[y+'-10-12','N. Sra. Aparecida / Dia das Crianças'],[y+'-11-02','Finados'],[y+'-11-15','Proclamação da República'],[y+'-11-20','Consciência Negra'],[y+'-12-25','Natal']]}
function syncFeriados(){
  if(!S.ano.ini||!S.ano.fim)return;
  const prev={};S.feriados.filter(f=>f.auto).forEach(f=>prev[f.data]=f.ativo);
  const autos=[];for(let y=+S.ano.ini.slice(0,4);y<=+S.ano.fim.slice(0,4);y++)nacionais(y).forEach(([data,nome])=>{if(data>=S.ano.ini&&data<=S.ano.fim)autos.push({data,nome,auto:true,ativo:prev[data]!==undefined?prev[data]:!/Cinzas/.test(nome)})});
  S.feriados=[...autos,...S.feriados.filter(f=>!f.auto)].sort((a,b)=>a.data<b.data?-1:1);
}

/* ---------- motor ---------- */
const cor=t=>CORES[Math.max(0,S.turmas.indexOf(t))%CORES.length];
function diaInfo(d,todas){
  if(!S.ano.ini||d<S.ano.ini||d>S.ano.fim)return{tipo:'fora',aulas:[]};
  const f=S.feriados.find(x=>x.ativo&&x.data===d);if(f)return{tipo:'feriado',nome:f.nome,aulas:[]};
  const r=S.recessos.find(x=>d>=x.ini&&d<=x.fim);if(r)return{tipo:'recesso',nome:r.nome||'Recesso',aulas:[]};
  const ex=S.extras.find(x=>x.data===d);const dow=ex?+ex.dow:pd(d).getDay();const g=S.grade[dow]||{};
  let aulas=S.slots.filter(s=>g[s.id]).map(s=>{const k=d+'|'+s.id;return{key:k,data:d,slot:s,turma:g[s.id].turma,comp:g[s.id].comp||S.prof.disc,info:S.aulas[k]||{}}});
  if(!todas&&filtroTurma)aulas=aulas.filter(a=>a.turma===filtroTurma);
  return{tipo:ex?'extra':'normal',nome:ex?'Dia letivo extra · horário de '+DIAS[dow]:'',aulas};
}

<div class="wnav"><button class="btn sec" onclick="gNav(-1)">Voltar</button><button class="btn" onclick="gNav(1)">${gq===L.length-1?'Concluir semana':'Próximo'}</button></div>

function pSetT(i){const[d,s]=gSeq()[gq];const g=S.grade[d]||(S.grade[d]={});if(i<0){delete g[s.id];salvar();return gNav(1)}g[s.id]={turma:S.turmas[i],comp:(g[s.id]&&g[s.id].comp)||S.prof.discs[0]||''};salvar();render()}

function badge(inf){if(inf.tipo==='feriado')return'<span class="badge fer">Feriado</span>';if(inf.tipo==='recesso')return'<span class="badge fer">Recesso</span>';if(inf.tipo==='extra')return'<span class="badge ext">Dia letivo extra</span>';return''}
function card(a,semHora){const i=a.info,n=IDX[a.key];return`<div class="card ${i.feita?'done':''} ${i.cancel?'cancel':''}" style="--c:${cor(a.turma)}" onclick="abrir('${a.key}')"><div class="ct">${semHora?'':`<span class="hr">${a.slot.ini}</span>`}<span class="chip" style="--c:${cor(a.turma)}">${esc(a.turma)}</span>${i.feita?'<span class="ok">✓</span>':''}${i.cancel?`<span class="num">🚫 ${esc(i.cancel)}</span>`:n?`<span class="num">aula ${n}/${TOT[a.turma]}</span>`:''}</div><div class="cm"><span class="comp">${esc(a.comp)}</span>${i.aval?`<span class="tag" style="background:#fde2e0;color:#c0392b;font-weight:700">📌 ${esc(i.aval)}</span>`:''}${i.plano?'<span class="tag">📝 plano</span>':''}</div><div class="as ${i.assunto?'':'vazio'}">${i.assunto?esc(i.assunto):'+ adicionar assunto do dia'}</div></div>`}
function diaBloco(d,inf){let h=`<div class="day ${d===TODAY?'today':''}"><div class="dh"><span>${fmtLong(d)}</span>${badge(inf)}</div>`;
  if(inf.tipo==='feriado'||inf.tipo==='recesso')h+=`<div class="off">Sem aula · ${esc(inf.nome)}</div>`;
  else if(inf.tipo==='fora')h+='<div class="off">Fora do ano letivo</div>';

  else h+=(inf.tipo==='extra'?`<div class="hint">${esc(inf.nome)}</div>`:'')+inf.aulas.map(a=>card(a)).join('');
  return h+'</div>'}
function vSemana(){
  let h=`<div class="nav"><button onclick="mvW(-7)">‹</button><b>${fmt(iso(weekStart))} a ${fmt(iso(addD(weekStart,5)))}</b><button onclick="mvW(7)">›</button></div><div style="display:flex;justify-content:space-between;align-items:center"><button class="link" onclick="resetNav();saveUI();render()">Ir para hoje</button>${GDOCS?'<button class="link" onclick="gDocsSemana()">📄 Planos da semana no Google Docs</button>':DL?'<button class="link" onclick="baixarSemana()">⬇ Planos da semana (.docx)</button>':''}</div>`;
  const dias=[];for(let i=0;i<6;i++){const d=iso(addD(weekStart,i));const inf=diaInfo(d);if(i===5&&inf.tipo!=='extra')continue;dias.push([d,inf])}
  h+='<div class="wk">'+dias.map(([d,inf])=>diaBloco(d,inf)).join('')+'</div>';

function planoSecao(D,p){
  p=p||{};
  const W=10466,F='Arial',B={style:D.BorderStyle.SINGLE,size:8,color:'000000'},N={style:D.BorderStyle.NONE,size:0,color:'FFFFFF'};
  const BOX={top:B,bottom:B,left:B,right:B},NONE={top:N,bottom:N,left:N,right:N};
  const linhas=t=>String(t||'').split(/\r?\n/);
  const run=(t,b)=>new D.TextRun({text:t,bold:!!b,font:F,size:22});
  function cel(w,label,valor,inline){
    const kids=[];
    if(inline){kids.push(new D.Paragraph({children:[run(label+' ',true),run(valor||'')]}))}
    else{kids.push(new D.Paragraph({spacing:{after:80},children:[run(label,true)]}));linhas(valor).forEach(l=>kids.push(new D.Paragraph({spacing:{after:40},children:[run(l)]})))}
    return new D.TableCell({width:{size:w,type:D.WidthType.DXA},borders:BOX,margins:{top:140,bottom:140,left:180,right:180},verticalAlign:inline?D.VerticalAlign.CENTER:D.VerticalAlign.TOP,children:kids});
  }
  const gap=w=>new D.TableCell({width:{size:w,type:D.WidthType.DXA},borders:NONE,children:[new D.Paragraph('')]});
  function linha(cols,altura){
    const cells=[],widths=[];
    cols.forEach((c,i)=>{if(i){cells.push(gap(238));widths.push(238)}cells.push(cel(c[0],c[1],c[2],c[3]));widths.push(c[0])});
    return new D.Table({width:{size:W,type:D.WidthType.DXA},columnWidths:widths,borders:{top:N,bottom:N,left:N,right:N,insideHorizontal:N,insideVertical:N},rows:[new D.TableRow({height:{value:altura,rule:D.HeightRule.ATLEAST},children:cells})]});
  }
  const esp=()=>new D.Paragraph({spacing:{before:0,after:0},children:[new D.TextRun({text:'',size:16})]});
  const meia=(W-238)/2,terco=(W-476)/3;
  return {properties:{page:{size:{width:11906,height:16838},margin:{top:720,bottom:720,left:720,right:720}}},children:[
      new D.Paragraph({alignment:D.AlignmentType.CENTER,spacing:{before:120,after:300},children:[new D.TextRun({text:'PLANO DE AULA',bold:true,font:'Arial Black',size:48})]}),
      linha([[terco,'Série:',p.serie,true],[terco,'Disciplina:',p.disciplina,true],[terco,'Data:',p.data,true]],620),esp(),
      linha([[meia,'Tópico:',p.topico,true],[meia,'Aula nº',p.aula,true]],620),esp(),
      linha([[W,'Foco e objetivos da aula:',p.foco]],1700),esp(),
      linha([[meia,'Materiais necessários:',p.materiais],[meia,'Objetivos de aprendizagem:',p.objetivos]],1750),esp(),
      linha([[W,'Estrutura / Atividade:',p.estrutura]],5300),esp(),
      linha([[W,'Avaliação:',p.avaliacao]],2650)
    ]};
}

${GDOCS?'<button class="btn" onclick="gDocsPlano()">📄 Abrir no Google Docs</button>':''}${DL?(GDOCS?'<button class="link" onclick="baixarPlano()">ou baixar o arquivo .docx</button>':'<button class="btn" onclick="baixarPlano()">⬇ Baixar .docx</button>'):(GDOCS?'':'<p class="hint">O download do Word funciona ao abrir o app pelo claude.ai.</p>')}
<button class="btn sec" onclick="gravarPlano();fechar();toast(\'Plano salvo\')">Salvar e fechar</button>
<button class="link" onclick="pq=0;planoTela()">Revisar pergunta por pergunta</button></div>`)}
function gravarPlano(){const cur=S.aulas[pkey]||{};S.aulas[pkey]=Object.assign({},cur,pinfo,{plano:Object.assign({},P)});if(!S.aulas[pkey].assunto&&P.topico)S.aulas[pkey].assunto=P.topico;salvar(true);render()}
async function baixarPlano(){
  if(!window.docx){toast('Gerador de Word não carregou. Verifique a internet.');return}
  let blob;try{blob=await gerarArquivoPlanos([pFinal()])}catch(e){toast('Erro ao gerar o Word');return}
  const nome=('Plano_'+(P.serie||'')+'_'+(P.data||'')).replace(/[\/\\:*?"<>|]/g,'-').replace(/\s+/g,'_')+'.docx';
  try{await DL.save({filename:nome,data:blob});toast('Plano baixado')}catch(e){toast(e&&e.code==='declined'?'Download cancelado':'Não foi possível baixar aqui')}
  gravarPlano()}

/* ---------- Google Docs ---------- */
const GDOCS=!window.claude;
const DOCX='application/vnd.openxmlformats-officedocument.wordprocessingml.document';
async function gDocs(L,nome){
  if(!window.docx){toast('Gerador de Word não carregou. Verifique a internet.');return}
  const cel=matchMedia('(pointer:coarse)').matches&&!!navigator.canShare;
  const w=cel?null:window.open('https://docs.google.com/document/u/0/','_blank');
  let blob;try{blob=await gerarArquivoPlanos(L)}catch(e){if(w)w.close();toast('Erro ao gerar o Word');return}
  const arq=nome.replace(/[\/\\:*?"<>|]/g,'-').replace(/\s+/g,'_')+'.docx';
  if(cel){const f=new File([blob],arq,{type:DOCX});
    if(navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:arq});return}catch(e){if(e&&e.name==='AbortError')return}}
    try{await DL.save({filename:arq,data:blob});toast('Plano baixado. Abra pelo app do Google Docs.')}catch(e){toast('Não foi possível baixar aqui')}return}
  try{await DL.save({filename:arq,data:blob})}catch(e){toast('Não foi possível baixar aqui');return}
  abrirSheet(`<h2>Quase lá 📄</h2><p class="hint">O plano foi baixado como <b>${esc(arq)}</b> e o Google Docs abriu em outra aba.</p>
<ol class="passos"><li>No Google Docs, clique no ícone de <b>pasta 📁</b> (Abrir seletor de arquivos).</li><li>Clique em <b>Fazer upload</b> e escolha o arquivo baixado.</li><li>Pronto: o plano abre no Google Docs para editar ou baixar.</li></ol>
${w?'':'<a class="btn" style="display:block;text-align:center;text-decoration:none" href="https://docs.google.com/document/u/0/" target="_blank" rel="noopener">Abrir o Google Docs</a>'}
<button class="btn sec" onclick="fechar()">Entendi</button>`)}
function nomeSemana(){return'Planos_semana_'+fmt(iso(weekStart)).replace('/','-')+'_a_'+fmt(iso(addD(weekStart,5))).replace('/','-')}
function gDocsPlano(){const p=pFinal(),n='Plano_'+(P.serie||'')+'_'+(P.data||'');gravarPlano();gDocs([p],n)}
function gDocsSemana(){const L=[];for(let i=0;i<6;i++){diaInfo(iso(addD(weekStart,i))).aulas.forEach(a=>{if(a.info.plano)L.push(a)})}if(!L.length){toast('Nenhum plano feito nesta semana');return}const ps=L.map(a=>{P=Object.assign({},a.info.plano);return pFinal()});gDocs(ps,nomeSemana())}
function render(){if(modo==='wizard'){document.getElementById('tb').style.display='none';document.body.classList.remove('temnav');renderWizard()}else renderApp()}
render();
</script>
