:root{--r1:10px;--r2:14px;--rp:999px}
:root{--g:#1d5fb8;--g2:#e6eefa;--tx:#1d2433;--mu:#6b7488;--bd:#dde3ec;--bg:#f4f6fa;--red:#c0392b;--sf:#fff;--sf2:#fafbfd;--rosa:#fde2e0;--amar:#fffbea}
*{box-sizing:border-box}
body{margin:0;font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
header{background:var(--g);color:#fff;padding:14px 16px 12px}
header .brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px}
header .logo{height:38px;width:auto;flex:none}
header .sub{font-size:13px;opacity:.9;margin-top:2px}
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
h2{margin:6px 0 10px;font-size:20px}
.hint{color:var(--mu);font-size:13px;margin:0 0 12px}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:var(--r1);font:inherit;background:var(--sf);color:var(--tx)}
textarea{min-height:80px;resize:vertical}
.btn{background:var(--g);color:#fff;border:0;border-radius:var(--r1);padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--sf);color:var(--g);border:1px solid var(--g)}
.btn.red{background:var(--sf);color:var(--red);border:1px solid var(--red)}
.btn.sm{padding:7px 12px;font-size:13px}
.link{background:none;border:0;color:var(--g);font:inherit;font-weight:600;cursor:pointer;padding:6px 0}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.row>.btn{flex:0 0 auto;white-space:nowrap}
.row>select,.row>input{flex:1 1 0}
.btn{white-space:nowrap}
.prog{height:6px;background:var(--bd);border-radius:var(--rp);overflow:hidden}
.prog div{height:100%;background:var(--g)}
.stepn{font-size:12px;color:var(--mu);margin-top:8px}
.err{color:var(--red);font-weight:600;font-size:14px;min-height:0}
.wnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--c,#555);color:#fff;border-radius:var(--rp);padding:3px 10px;font-size:13px;font-weight:600}
.chip button{background:none;border:0;color:#fff;font-size:16px;cursor:pointer;padding:0}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r2);padding:12px;margin:10px 0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.tab{flex:1;border:1px solid var(--bd);background:var(--sf);border-radius:var(--r1);padding:9px 6px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--g);color:#fff;border-color:var(--g)}
.tab small{opacity:.75;font-weight:500}
.slotrow{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r1);padding:8px;margin-bottom:6px;display:grid;grid-template-columns:96px 1fr;gap:6px;align-items:center}
.slotrow.busy{border-color:var(--g);background:var(--g2)}
.slotrow input{grid-column:2}
.st b{display:block;font-size:13px}.st small{color:var(--mu);font-size:12px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 96px 96px 32px;gap:6px;margin-bottom:6px}
.srow input{padding:10px 8px}.srow input[type=time]{padding:10px 4px 10px 8px}
.x{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r1);color:var(--red);font-size:18px;cursor:pointer}
.fer{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--bd);font-size:14px}
.fer input[type=checkbox]{width:20px;height:20px;flex:none}
.fer .d{font-weight:700;width:78px;flex:none}
.fer .n{flex:1}
.fer.wk{opacity:.5}
.tag{font-size:11px;background:#eee;border-radius:var(--rp);padding:2px 6px;color:#555}
nav.tb{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;z-index:5}
nav.tb button{flex:1;background:none;border:0;padding:9px 2px 11px;font:inherit;font-size:12px;color:var(--mu);cursor:pointer}
nav.tb button b{display:block;font-size:19px;line-height:1.2}
nav.tb button.on{color:var(--g);font-weight:700}
.filt{display:flex;gap:8px;margin-bottom:10px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r2);padding:6px}
.nav button{background:var(--g2);border:0;border-radius:var(--r1);width:42px;height:38px;font-size:22px;color:var(--g);cursor:pointer}
.day{margin-top:14px}
.dh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;margin-bottom:6px}
.day.today .dh span:first-child{color:var(--g)}
.day.today .dh span:first-child::after{content:" • hoje";font-size:12px}
.badge{font-size:11px;font-weight:700;border-radius:var(--rp);padding:2px 7px;text-transform:none}
.badge.fer{background:#fde2e0;color:var(--red)}
.badge.ext{background:#e3effd;color:#1f5fa8}
.off{background:var(--sf);border:1px dashed var(--bd);border-radius:var(--r2);padding:10px;color:var(--mu);font-size:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:var(--r2);padding:9px 10px;margin-bottom:6px;cursor:pointer}
.card.done{opacity:.7}
.card.cancel{opacity:.6;background:#f3f3f3}
.card.cancel .as{text-decoration:line-through}
.pend{background:#fff4e5;border:1px solid #f6c343;border-radius:var(--r2);padding:8px 10px;margin-bottom:10px;font-size:14px}
.pend button{background:none;border:0;color:#8a5a00;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:2px 0;text-align:left}
.ct{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hr{font-weight:700;font-size:13px}
.comp{font-size:13px;font-weight:600}
.num{font-size:11px;color:var(--mu);margin-left:auto}
.ok{color:var(--g);font-weight:800}
.as{margin-top:5px;font-size:14px}
.cm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px}
.wkg{display:none}
.cfg{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r2);padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.cfg h3{font-size:16px;margin:0}.cfg .hint{margin:0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);border-radius:var(--r1);padding:10px 12px;cursor:pointer}
.opt.on{border-color:var(--g);background:#edf2fb}.opt input{width:auto;margin-top:3px}
.opt span{display:flex;flex-direction:column}
.passos{margin:6px 0 12px;padding-left:20px;line-height:1.5;font-size:15px}.passos li{margin-bottom:6px}.opt small{color:var(--mu);font-size:13px}
button.opt{background:var(--sf);color:var(--tx);font:inherit}button.opt:hover{border-color:var(--g)}
.as.vazio{color:var(--g);font-weight:600;font-size:13px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.mh{text-align:center;font-size:12px;font-weight:700;color:var(--mu)}
.mc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r1);min-height:50px;padding:4px;font-size:13px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}
.mc.out{opacity:.35}
.mc.today{border-color:var(--g);border-width:2px}
.mc.sel{background:var(--g2)}
.mc.hol{background:#fdecea}
.mc i{font-style:normal;font-size:11px;font-weight:700;border-radius:var(--rp);padding:1px 6px;align-self:flex-end}
.mc i.full{background:var(--g);color:#fff}
.mc i.pend{background:#f6c343;color:#3d3000}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:8px}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:var(--rp);margin-right:4px;vertical-align:-1px;background:var(--lc)}
table{width:100%;border-collapse:collapse;background:var(--sf);border-radius:var(--r2);overflow:hidden;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:center}
th:first-child,td:first-child{text-align:left}
th{background:var(--g2);font-size:12px}
.modal{position:fixed;inset:0;background:rgba(16,32,20,0);display:flex;align-items:flex-end;justify-content:center;z-index:10;transition:background .24s ease}
.modal.open{background:rgba(16,32,20,.42)}
body.travado{overflow:hidden}
.modal.hidden{display:none}
.sheet{position:relative;background:var(--sf);width:100%;max-width:560px;border-radius:var(--r2) var(--r2) 0 0;padding:6px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 30px rgba(16,32,20,.14)}
.modal.open .sheet{transform:translateY(0)}
.grip{width:42px;height:5px;border-radius:var(--rp);background:#d5dcd6;margin:4px auto 10px;cursor:grab}
.xg{position:absolute;top:10px;right:10px;width:36px;height:36px;border:0;border-radius:var(--r1);background:#f1f4f1;color:#4a554c;font-size:24px;line-height:1;cursor:pointer;display:none}
@media (prefers-reduced-motion:reduce){.modal,.sheet{transition:none!important}}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;margin:10px 0}
.ck input{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:var(--r1);font-size:14px;z-index:20}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pv{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r2);padding:12px;font-family:Arial,sans-serif;color:#000}
.pv h1{text-align:center;font-family:'Arial Black',Arial,sans-serif;font-size:22px;margin:4px 0 12px}
.pv .pr{display:grid;gap:6px;margin-bottom:6px}
.pv .b{border:1.5px solid #000;padding:6px 8px;font-size:13px;cursor:pointer;min-height:34px;white-space:pre-wrap;word-break:break-word}
.pv .b:hover{background:#f3f6fc}
.pv .b b{display:block}
.pv .b.i b{display:inline}
.pv .b.vz{color:#b07d00}
input,select,textarea{font-size:16px}
nav.tb{padding-bottom:env(safe-area-inset-bottom)}
.mc .mt{display:none}
.wk,.mesw{display:block}
@media(min-width:700px){main{padding-bottom:100px}}
@media(min-width:900px){
  body{font-size:15px}
  header{padding:16px 28px 14px;position:relative;z-index:6}
  header .brand{font-size:20px}
  header .logo{height:44px}
  body.temnav{position:relative;min-height:100vh}
  nav.tb{position:absolute;top:0;bottom:0;right:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:92px 10px 10px;gap:4px;background:var(--sf)}
  nav.tb button{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r1);font-size:15px;text-align:left}
  nav.tb button b{display:inline;font-size:19px}
  nav.tb button:hover{background:var(--g2)}
  nav.tb button.on{background:var(--g2)}
  body.temnav main{margin-left:200px}
  main{max-width:1180px;padding:22px 28px 40px}
  body:not(.temnav) main{max-width:760px}
  .filt select{max-width:280px}
  .wk{display:none}
  .wkg{display:grid;gap:8px;margin-top:12px;align-items:stretch}
  .wkg .gh{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r2);grid-row:1}
  .wkg .gh b{font-size:15px}.wkg .gh small{color:var(--mu);font-size:12px}
  .wkg .gh.today{border-color:var(--g);background:#edf2fb}.wkg .gh.today b{color:var(--g)}
  .wkg .gt{grid-column:1;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding-right:4px;border-right:2px solid var(--bd)}
  .wkg .gt b{font-size:14px}.wkg .gt small{font-size:11px;color:var(--mu)}
  .wkg .gc{display:flex}.wkg .gc .card{flex:1;margin:0;display:flex;flex-direction:column}
  .wkg .gc .card .as{margin-top:auto;padding-top:6px}
  .wkg .gv{flex:1;border:1px dashed var(--bd);border-radius:var(--r2);min-height:96px;background:repeating-linear-gradient(135deg,transparent 0 8px,#f6f7f6 8px 9px)}
  .wkg .goff{display:flex;align-items:center;justify-content:center;text-align:center;background:#fdecea;color:#c0392b;border-radius:var(--r2);font-size:14px;padding:10px}
  .wk .day{margin-top:12px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r2);padding:10px}
  .mesw{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:20px;align-items:start}
  .mside .day{margin-top:10px}
  .mc{min-height:92px;padding:6px}
  .mc .mt{display:flex;flex-direction:column;gap:2px;margin-top:3px}
  .mc .mt span{font-size:10px;font-weight:600;color:#fff;background:var(--c);border-radius:var(--rp);padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card{transition:box-shadow .15s}
  .card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .btn:hover{filter:brightness(1.05)}
  .modal{align-items:stretch;justify-content:flex-end}
  .sheet{border-radius:var(--r2) 0 0 var(--r2);width:min(640px,92vw);max-width:none;max-height:none;height:100%;padding:24px 26px 26px;transform:translateX(100%);box-shadow:-10px 0 40px rgba(16,32,20,.16)}
  .modal.open .sheet{transform:translateX(0)}
  .grip{display:none}
  .xg{display:block}
  #sheet>:first-child{padding-right:46px}
  .resbtn{display:grid!important;grid-template-columns:1fr 1fr;gap:10px}
  .resbtn h3,.resbtn p{grid-column:1/-1}
  table{font-size:15px}
}
.i{display:inline-block;width:1.15em;height:1.15em;flex:none;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;vertical-align:-.2em}

html[data-t=dark]{color-scheme:dark;--g:#6ea8f5;--g2:#18263d;--tx:#e3e8f0;--mu:#97a1b3;--bd:#2b3546;--bg:#0d121a;--red:#ff7b6e;--sf:#151c27;--sf2:#19212e;--rosa:#3d2220;--amar:#2f2a17}
html[data-t=dark] header{background:#163f7a}
html[data-t=dark] .btn,html[data-t=dark] .tab.on,html[data-t=dark] .mc i.full,html[data-t=dark] .prog div{background:#2563c4;color:#fff;border-color:#2563c4}
html[data-t=dark] .btn.sec,html[data-t=dark] .btn.red{background:transparent}
html[data-t=dark] .btn.sec{color:var(--g);border-color:var(--g)}
html[data-t=dark] .tag{background:#252f3f;color:#c3cbd8}
html[data-t=dark] .badge.ext{background:#1b2a3d;color:#8cb8f0}
html[data-t=dark] .card.cancel{background:#1b202a}
html[data-t=dark] div.pend{background:#2e2615;border-color:#6b5520}
html[data-t=dark] .mc i.pend{background:#f6c343;color:#2b2100}
html[data-t=dark] .mc i.full{color:#fff}
html[data-t=dark] .pend button{color:#f2c96b}
html[data-t=dark] .opt.on,html[data-t=dark] .wkg .gh.today{background:var(--g2)}
html[data-t=dark] .mc.hol,html[data-t=dark] .wkg .goff{background:#3a1f1d;color:#ff9a8f}
html[data-t=dark] .wkg .gv{background:repeating-linear-gradient(135deg,transparent 0 8px,#1a2230 8px 9px)}
html[data-t=dark] .xg{background:#232d3c;color:#c3cbd8}
html[data-t=dark] .grip{background:#3a4558}
html[data-t=dark] .modal.open{background:rgba(0,0,0,.6)}
html[data-t=dark] input,html[data-t=dark] select,html[data-t=dark] textarea{background:#101722}
html[data-t=dark] .pv{background:#fff;color:#000}
.leg span.lfer{--lc:#fdecea}html[data-t=dark] .leg span.lfer{--lc:#5a2a26}

main.gm{max-width:1280px!important;margin:0 auto!important;padding:16px 14px 60px}
.gcard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r2);padding:20px;max-width:460px;margin:30px auto;display:flex;flex-direction:column;gap:6px}
.gcard h2{margin:0 0 4px}
.gbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.gnav{display:flex;gap:8px;align-items:center}
.gres{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;margin-bottom:10px;color:var(--mu)}.gres b{color:var(--tx)}
.gwrap{overflow-x:auto;border-radius:var(--r2)}
.gtab td{vertical-align:top;padding:5px;min-width:130px;text-align:left}.gtab th.hj{color:var(--g)}
.gh{white-space:nowrap;text-align:center!important;min-width:56px!important;color:var(--mu)}.gh b{color:var(--tx)}
.gf{background:var(--sf2);color:var(--mu);text-align:center!important;vertical-align:middle!important;font-weight:600}
.ga{position:relative;border-left:4px solid var(--c);background:var(--sf2);border-radius:8px;padding:4px 22px 4px 7px;margin:3px 0;font-size:13px;line-height:1.25;transition:opacity .15s}
.ga .gt{font-weight:700;margin-right:5px}.ga .gp{color:var(--mu)}.ga small{display:block;color:var(--mu);font-size:11px}
.ga.dim{opacity:.28}.ga.on{outline:2px solid var(--g);background:var(--g2)}
.gs{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}.ga .gs{position:absolute;top:7px;right:7px}
.gs-ok{background:#1f9d4c}.gs-pend{background:#e8a317}.gs-off{background:transparent;border:2px solid #9aa59e;width:9px;height:9px}
.gmob{display:none}.gmrow{display:flex;gap:10px;border-bottom:1px solid var(--bd);padding:6px 0}.gmrow .gh{display:flex;flex-direction:column;width:52px}.gml{flex:1}
.gcod{font-size:34px;font-weight:800;letter-spacing:6px;color:var(--g);text-align:center;background:var(--g2);border-radius:var(--r1);padding:10px}
.gli{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--bd);padding:6px 0;font-size:14px}
.x{background:none;border:0;color:var(--red);font-size:20px;cursor:pointer;padding:0 6px}
.gcard a{color:var(--g);font-weight:600}tr.clk{cursor:pointer}tr.clk:hover td{background:var(--sf2)}
@media(max-width:899px){.gdesk{display:none}.gmob{display:block}.gmob .tab{padding:6px 2px;line-height:1.2}}
</style>

    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===sep){row.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(c);R.push(row);row=[];c=''}else c+=ch}

${(E.recessos||[]).map((r,i)=>`<div class="gli"><span><b>${fmt(r.ini)} a ${fmtA(r.fim)}</b> ${esc(r.nome)}</span><button class="x" onclick="E.recessos.splice(${i},1);salvarE()">×</button></div>`).join('')}
<label class="f">Feriado ou dia sem aula</label><div class="row"><input type="date" id="fd"><input id="fn" placeholder="Nome (ex.: Aniversário da cidade)"></div><button class="btn sec" onclick="addFerG()">Adicionar feriado</button>
<label class="f">Recesso (vários dias)</label><div class="row"><input type="date" id="ri"><input type="date" id="rf"></div><input id="rn" placeholder="Nome (ex.: Férias de julho)" style="margin-top:8px"><button class="btn sec" onclick="addRecG()">Adicionar recesso</button></div>
<div class="cfg"><h3><i class="i i-config"></i> Quem acessa este painel</h3>${ad.map(m=>`<div class="gli"><span>${esc(m)}${m===user.email?' <small class="hint">(você)</small>':''}</span>${m!==user.email?`<button class="x" onclick="rmAdmin('${esc(m)}')">×</button>`:''}</div>`).join('')}
<div class="row"><input id="nadm" type="email" placeholder="E-mail Google da gestão"><button class="btn" onclick="addAdmin()">Adicionar</button></div></div>
<div class="cfg"><h3>Conta</h3><p class="hint">Conectado como ${esc(user.email)}.</p><button class="btn red" onclick="sair()">Sair</button></div>`}
function copiarConvite(){const t=`Nosso horário está no Organizador de Aulas! Abra ${location.origin}/ , vá em Ajustes › Código da escola (ou no começo do cadastro) e digite o código ${COD}. Seu horário já chega montado.`;navigator.clipboard.writeText(t).then(()=>toast('Convite copiado. Cole no grupo dos professores.'),()=>toast('Não foi possível copiar'))}
function salvarAno(){const a=document.getElementById('ai').value,b=document.getElementById('af').value;if(!a||!b||b<a)return toast('Confira as datas');E.ano={ini:a,fim:b};salvarE('Ano letivo salvo')}
function addFerG(){const d=document.getElementById('fd').value,n=document.getElementById('fn').value.trim();if(!d)return toast('Escolha a data');E.feriados=(E.feriados||[]).concat({data:d,nome:n||'Feriado'}).sort((a,b)=>a.data<b.data?-1:1);salvarE('Feriado adicionado')}
function addRecG(){const a=document.getElementById('ri').value,b=document.getElementById('rf').value,n=document.getElementById('rn').value.trim();if(!a||!b||b<a)return toast('Confira as datas do recesso');E.recessos=(E.recessos||[]).concat({ini:a,fim:b,nome:n||'Recesso'});salvarE('Recesso adicionado')}
async function setAdmins(L){try{await db.collection('gestao').doc(COD).update({admins:L});GD.admins=L;render();toast('Acesso atualizado')}catch(e){toast(msgErro(e))}}
function addAdmin(){const m=document.getElementById('nadm').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(m))return toast('E-mail inválido');if(GD.admins.includes(m))return toast('Já tem acesso');setAdmins(GD.admins.concat(m))}
function rmAdmin(m){if(confirm('Tirar o acesso de '+m+'?'))setAdmins(GD.admins.filter(x=>x!==m))}

/* importar */
function baixarModeloG(){const L=[['Professor','Dia','Início','Fim','Turma','Disciplina'],['Professor A','Segunda','07:20','08:05','6º A','Ciências'],['Professor A','Segunda','08:05','08:50','7º B','Ciências'],['Professor B','Segunda','07:20','08:05','7º B','Matemática'],['Professor B','Terça','09:55','10:40','1ª Série A','Matemática']];
  const t='﻿'+L.map(r=>r.join(';')).join('\r\n');const u=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='modelo-horario-escola.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function lerPlanilhaG(f){if(!f)return;const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(ext==='csv'||ext==='txt'){const r=new FileReader();r.onload=()=>previaG(lerCSV(String(r.result)));r.readAsText(f,'utf-8');return}
  toast('Lendo a planilha…');carregarXLSX().then(()=>{const r=new FileReader();r.onload=()=>{try{const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});const w=wb.Sheets[wb.SheetNames[0]];previaG(XLSX.utils.sheet_to_json(w,{header:1,raw:false,defval:''}).map(l=>l.map(c=>String(c==null?'':c))))}catch(e){toast('Não consegui ler essa planilha')}};r.readAsArrayBuffer(f)}).catch(()=>toast('Sem internet para ler .xlsx. Salve como .csv.'))}
function diaNum(v){const k=semAcI(v).replace(/[^a-z0-9]/g,'');const m={seg:1,ter:2,qua:3,qui:4,sex:5,sab:6,dom:0};if(m[k.slice(0,3)]!==undefined)return m[k.slice(0,3)];const n=k.match(/^([2-6])/);return n?+n[1]-1:null}
function previaG(R){R=(R||[]).map(r=>r.map(c=>String(c==null?'':c).trim())).filter(r=>r.some(Boolean));
  const qual=h=>{h=semAcI(h);if(/^(prof|docente|servidor)/.test(h))return'p';if(/^dia/.test(h))return'd';if(/^(inic|hora|horario)/.test(h))return'i';if(/^(fim|term|saida)/.test(h))return'f';if(/^(turma|serie|classe)/.test(h))return't';if(/^(discip|compon|materia)/.test(h))return'c';return null};
  let hi=-1,col={};for(let i=0;i<Math.min(R.length,15)&&hi<0;i++){const c={};R[i].forEach((v,j)=>{const q=qual(v);if(q&&c[q]===undefined)c[q]=j});if(c.p!==undefined&&c.d!==undefined&&c.i!==undefined&&c.t!==undefined){hi=i;col=c}}
  if(hi<0){abrirSheet(`<h2>Não reconheci a planilha</h2><p class="hint">A primeira linha precisa ter os títulos <b>Professor, Dia, Início, Fim, Turma, Disciplina</b>. Baixe o modelo para não errar.</p><button class="btn" onclick="fechar();baixarModeloG()">Baixar modelo</button>`);return}
  const profs=[],aulas=[],slots={},probs=[],vis={};
  R.slice(hi+1).forEach((r,n)=>{const g=k=>col[k]!==undefined?r[col[k]]||'':'';const lin='Linha '+(hi+n+2)+': ';const nome=g('p').replace(/\s+/g,' ').trim();
    const d=diaNum(g('d'));if(!d||d>5){probs.push(lin+(d===6?'sábado ignorado':'dia "'+g('d')+'" não reconhecido'));return}
    let hs=horasDe(g('i'));if(hs.length<2)hs=hs.concat(horasDe(g('f')));if(hs.length<2){probs.push(lin+'falta início ou fim');return}
    const[i,f]=hs;if(f<=i){probs.push(lin+'horário termina antes de começar');return}
    const tc=g('t');const L=lerCelula(tc);const t=L&&!L.erro?L.turma:tc.trim();if(!t){probs.push(lin+'sem turma');return}
    const id=nome?idProf(nome):'';if(id&&!profs.some(p=>p.id===id))profs.push({id,nome});
    const key=(id||'t:'+t)+'|'+d+'|'+i;if(vis[key]){probs.push(lin+nome+' já tem aula em '+DIAS[d]+' '+i);return}vis[key]=1;
    if(!slots[i])slots[i]={ini:i,fim:f};aulas.push({p:id,d,i,t,c:g('c').trim()})});
  if(!aulas.length){abrirSheet(`<h2>Nenhuma aula encontrada</h2>${probs.length?'<p class="hint">'+probs.slice(0,6).map(esc).join('<br>')+'</p>':''}<button class="btn" onclick="fechar()">OK</button>`);return}
  impG={profs,aulas,slots:Object.values(slots).sort((a,b)=>a.ini<b.ini?-1:1)};const turmas=[...new Set(aulas.map(a=>a.t))].sort((a,b)=>a.localeCompare(b,'pt',{numeric:true}));
  const sai=(E.profs||[]).filter(p=>!profs.some(x=>x.id===p.id));
  abrirSheet(`<h2>Conferir horário</h2><p class="hint">Encontrei <b>${profs.length}</b> professores, <b>${aulas.length}</b> aulas por semana, <b>${turmas.length}</b> turmas e <b>${impG.slots.length}</b> horários.</p>
<div class="gwrap"><table><tr><th style="text-align:left">Professor</th><th>Aulas</th><th>Turmas</th></tr>${[...profs].sort((a,b)=>a.nome.localeCompare(b.nome)).map(p=>{const A=aulas.filter(a=>a.p===p.id);return`<tr><td style="text-align:left">${esc(p.nome)}</td><td>${A.length}</td><td><small>${esc([...new Set(A.map(a=>a.t))].join(', '))}</small></td></tr>`}).join('')}</table></div>
${sai.length?`<p class="hint" style="margin-top:8px"><i class="i i-warn"></i> Saem do horário: ${esc(sai.map(p=>p.nome).join(', '))}.</p>`:''}
${probs.length?`<div class="box" style="background:var(--amar);border-color:#f6c343"><b><i class="i i-warn"></i> ${probs.length} linha(s) ficaram de fora</b><p class="hint" style="margin:4px 0 0">${probs.slice(0,8).map(esc).join('<br>')}${probs.length>8?'<br>…':''}</p></div>`:''}
${(E.aulas||[]).length?'<p class="hint">Isso substitui o horário atual da escola.</p>':''}
<button class="btn" style="width:100%;margin-top:8px" onclick="aplicarG()">Usar este horário</button><button class="link" style="width:100%" onclick="fechar()">Cancelar</button>`)}
function aplicarG(){if(!impG)return;E.profs=impG.profs;E.aulas=impG.aulas;E.slots=impG.slots;impG=null;fechar();aba='semana';filtroP='';salvarE('Horário da escola salvo')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')fechar()});
render();iniciar();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
